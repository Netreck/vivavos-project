<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Vivavós - Informação para o paciente. Mostre a caixa do remédio ou o papel do exame e ouça a explicação em palavras simples." />
    <meta name="theme-color" content="#0A4F8A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Vivavós - Informação para o paciente</title>
  </head>
  <body class="antialiased">
    <!-- VLibras: tradução do conteúdo para Libras (widget oficial do Governo Federal) -->

      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <div id="root"></div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
